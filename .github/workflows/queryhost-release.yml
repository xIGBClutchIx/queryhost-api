name: QueryHost release

# Opens a pull request that moves the exact `queryhost` pin to a newer npm release, and
# merges it, which deploys, once it is the bot's untouched single commit, current with the
# default branch, `verify` passed on its head, and no Codex review of that head has
# unresolved findings. Close it, mark it draft, or push to its branch to stop the merge.
#
# The library's publish workflow dispatches this with the released version as soon as npm
# has it; the schedule is the fallback and runs the later merge checks.
#
# The steps live in `consumer-bump.yml` beside this file, which queryhost-web also calls,
# so both consumers get fixes at once. Web tracks it at `@main`, so a change merged here
# takes effect there on its next run without a review in that repository; both
# repositories have the same owner, which accepts that trade-off.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: queryhost version to pin (defaults to the npm latest tag)
        required: false
        type: string

concurrency:
  group: queryhost-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # The called jobs narrow this further: the job that runs package code gets only
    # `contents: read`, and the job that writes never runs package code.
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/consumer-bump.yml
    with:
      commit_title: "chore: update queryhost to"
      version: ${{ inputs.version || '' }}
