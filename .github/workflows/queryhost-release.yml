name: QueryHost release

# Opens a pull request that moves the exact `queryhost` pin to a newer npm release.
# The library's publish workflow dispatches this right after `npm publish`; the hourly
# schedule catches a release when that dispatch is not configured. Merging stays manual.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: queryhost version to pin (defaults to the npm latest tag)
        required: false
        type: string

concurrency:
  group: queryhost-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  COMMIT_TITLE: "chore: update queryhost to"

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Move the queryhost pin
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/bump-queryhost.mjs $VERSION --body "$RUNNER_TEMP/body.md"

      - name: Open the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ steps.bump.outputs.to }}
        run: |
          branch="queryhost/v$TO"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists; leaving its pull request alone."
            exit 0
          fi
          if [ -n "$(gh pr list --state open --search "\"queryhost to $TO\" in:title" --json number --jq '.[].number')" ]; then
            echo "A pull request for queryhost $TO is already open."
            exit 0
          fi

          base="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$base" > /dev/null

          # Commit through the API so GitHub signs it; the runner holds no signing key.
          jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$branch" \
            --arg head "$base" \
            --arg headline "$COMMIT_TITLE $TO" \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repo, branchName: $branch},
              expectedHeadOid: $head,
              message: {headline: $headline},
              fileChanges: {additions: []}
            }}}' > "$RUNNER_TEMP/commit.json"
          git diff --name-only | while IFS= read -r file; do
            base64 -w0 "$file" > "$RUNNER_TEMP/contents"
            jq --arg path "$file" --rawfile contents "$RUNNER_TEMP/contents" \
              '.variables.input.fileChanges.additions += [{path: $path, contents: $contents}]' \
              "$RUNNER_TEMP/commit.json" > "$RUNNER_TEMP/next.json"
            mv "$RUNNER_TEMP/next.json" "$RUNNER_TEMP/commit.json"
          done
          gh api graphql --input "$RUNNER_TEMP/commit.json" > /dev/null

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "$COMMIT_TITLE $TO" \
            --body-file "$RUNNER_TEMP/body.md" \
            --assignee "$GITHUB_REPOSITORY_OWNER"

          # Pull requests opened with GITHUB_TOKEN do not start pull_request workflows,
          # so run CI on the branch explicitly; its check attaches to the PR's head commit.
          gh workflow run ci.yml --ref "$branch"
